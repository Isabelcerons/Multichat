<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Iniciando Multichat…</title>
<style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#f4f3ee;font:16px "Segoe UI",system-ui,sans-serif;color:#1d1d1b}
  .c{text-align:center} h1{font-size:22px;margin:0 0 6px} p{color:#6c6a63;margin:4px 0}
  .s{width:38px;height:38px;border:4px solid #d8e5ef;border-top-color:#1f5f8b;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style></head>
<body><div class="c"><div class="s"></div><h1>💬 Iniciando Multichat…</h1>
<p>Esta página se abrirá sola cuando el sistema esté listo.</p><p id="t">Esperando al servidor…</p>
<p style="margin-top:18px"><a href="http://localhost:8000" style="color:#1f5f8b">Si no entra solo, haz clic aquí</a></p></div>
<script>
  // Se abre al instante desde iniciar.bat y espera a que el servidor responda; luego entra solo.
  const t0 = Date.now();
  async function check(){
    try{ await fetch('http://localhost:8000/api/index', {mode: 'no-cors', cache: 'no-store'}); location.replace('http://localhost:8000'); }
    catch(e){ document.getElementById('t').textContent = `Esperando al servidor… ${Math.round((Date.now() - t0) / 1000)} s`; setTimeout(check, 1000); }
  }
  check();
</script></body></html>
